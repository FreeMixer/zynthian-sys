# plugin-hostd settings for Zynthian: the mod-host of MOD-UI
# (ZYNTHIAN_MODHOST_BACKEND=plugin-hostd) and the UI's PH engine both read it.
# It is copied to /zynthian/config/plugin-hostd.conf once (by
# scripts/recipes/install_openmixer.sh, or by the first start of the backend),
# so edit that copy. One "key value" per line;
# `man plugin-hostd` lists every key. LV2_PATH comes from mod-host.service.

# Zynthian's own mod-host build, the same one jack_load loads as an internal
# client. plugin-hostd runs it only when lv2_worker below names it.
mod_host /usr/local/bin/mod-host

# Program that runs a CLAP plugin (package omx-clap-host).
clap_host omx-clap-host

# Who runs an LV2 plugin: omx-clap-host, through its LV2 adapter. A plugin the
# adapter refuses is reported with its reason (the add answers -512 and the
# lv2_adapter_refused event names the cause); it is never handed to another
# host. Write mod-host here to run every LV2 plugin on mod-host instead.
lv2_worker omx-clap-host

# Every add is checked against a pin: the hashes of the plugin's files.
require_pins 1

# first-use: a plugin the qualification sync has not reached yet still loads.
# Its pin is recorded on its first add and it runs in a worker of its own.
# strict would refuse it until the sync qualifies it, which on a new image
# takes a while after the first boot.
pin_mode first-use

# The pins plugin-qualify-sync writes (plugin-qualify-sync.service). A plugin
# qualified in-process may share a worker and form a chain; one the sync
# refused is refused until the user chooses to load it anyway (pin_accept),
# and then runs alone in a worker of its own; one whose files changed since is
# refused until it is qualified again or its new pin is accepted.
pin_file /var/lib/omx/qualified.pins

# The sync's qualification records (verdict, cost, version tested).
qualification_dir /var/lib/omx/qualification

# Checkpoints and worker logs. /run is tmpfs: nothing is written to the SD card.
state_root /run/plugin-hostd

# Descriptors written by the scan of each added plugin, kept across reboots.
# omx-panel can build a MOD GUI from them.
descriptor_dir /var/lib/omx/descriptors
