# plugin-hostd settings for Zynthian, used when ZYNTHIAN_MODHOST_BACKEND=plugin-hostd.
# sbin/mod-host-backend.sh copies this file to /zynthian/config/plugin-hostd.conf
# the first time and never after, so edit that copy. One "key value" per line;
# `man plugin-hostd` lists every key. LV2_PATH comes from mod-host.service.

# Program that runs an LV2 plugin mod-host style: Zynthian's own mod-host build,
# the same one jack_load loads as an internal client.
mod_host /usr/local/bin/mod-host

# Program that runs a CLAP plugin (package omx-clap-host).
clap_host omx-clap-host

# Who runs an LV2 plugin: auto tries the LV2 adapter of omx-clap-host first and
# gives mod-host what the adapter refuses, each in a worker of its own.
lv2_worker auto

# No pin check on add. Packages ship no pins until omx-plugins 0.15; set 1 then,
# or now to record each plugin's pin on its first add (pin_mode first-use).
require_pins 0

# Checkpoints and worker logs. /run is tmpfs: nothing is written to the SD card.
state_root /run/plugin-hostd

# Descriptors written by the scan of each added plugin, kept across reboots.
# omx-panel can build a MOD GUI from them.
descriptor_dir /var/lib/omx/descriptors
