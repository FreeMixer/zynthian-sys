# plugin-qualify-sync settings for Zynthian. scripts/recipes/install_openmixer.sh
# writes this file to /etc/omx/qualify.conf once, with #MULTIARCH# replaced by
# the machine's multiarch triplet. `plugin-qualify-sync --help` lists every key.

# The LV2 directories, in the order of Zynthian's LV2_PATH, which is the order
# plugin-hostd searches them: a plugin is qualified from the bundle plugin-hostd loads.
lv2_path /usr/lib/lv2:/usr/lib/#MULTIARCH#/lv2:/usr/local/lib/lv2:/usr/local/lib/#MULTIARCH#/lv2:/zynthian/zynthian-plugins/lv2:/zynthian/zynthian-my-data/plugins/lv2

# After those: the user's plugin directory, and the bundles of Pianoteq, which
# install_pianoteq_binary.sh links into /zynthian/zynthian-plugins/lv2. A plugin
# found twice is qualified from the first directory, so the link is the one used.
lv2_extra /zynthian/zynthian-my-data/plugins:/zynthian/zynthian-sw/pianoteq/arm-64bit

# Where plugin-hostd reads them: config/plugin-hostd.conf names the same paths.
pin_file /var/lib/omx/qualified.pins
qualification_dir /var/lib/omx/qualification
descriptor_dir /var/lib/omx/descriptors

# MOD-UI's plugin-hostd: new pins are sent to it while it runs.
hostd_port 5555
