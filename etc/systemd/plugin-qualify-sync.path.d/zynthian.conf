# Zynthian's plugin directories that plugin-qualify's own list leaves out
# (config/qualify.conf). A directory that is not there yet is watched from its parent.
[Path]
PathChanged=/usr/lib/aarch64-linux-gnu/lv2
PathChanged=/usr/local/lib/aarch64-linux-gnu/lv2
PathChanged=/zynthian/zynthian-my-data/plugins
PathChanged=/zynthian/zynthian-sw/pianoteq/arm-64bit
