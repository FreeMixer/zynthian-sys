# omx-panel's unit, on this image: read the plugins where Zynthian keeps them (the same list as zynthian_envars.sh,
# as omx-modgui-sync.service.d/zynthian.conf; scripts/update_zynthian_sys.sh fills the placeholder). The complement
# bundles it writes go to /usr/local/lib/lv2, which is on it, so jalv, mod-host and mod-ui load them.
[Service]
Environment=LV2_PATH=#LV2_PATH#
